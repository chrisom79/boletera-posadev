events {}

http {
   # Short-lived microcache for the small set of public, unauthenticated, read-only
   # JSON endpoints (event details/products/questions). These are what a real ticket
   # rush hammers hardest with identical requests from every visitor, and this box
   # is a single vCPU shared by PHP-FPM, Node SSR, Postgres and Redis — caching these
   # for a few seconds turns a thundering herd of PHP+DB work into a single request.
   fastcgi_cache_path /dev/shm/fastcgi_cache levels=1:2 keys_zone=api_cache:10m max_size=50m inactive=60s;

   map $request_method $cache_bypass_method {
       default 1;
       GET     0;
       HEAD    0;
   }

   map $http_cookie $cache_has_cookie {
       default 1;
       ""      0;
   }

   map $http_authorization $cache_has_auth {
       default 1;
       ""      0;
   }

   # Combine every bypass condition into one variable via string concatenation —
   # this avoids "if" inside a location, which has well-documented surprising
   # interactions with other directives in that same location (see the nginx
   # wiki's "IF is Evil" page). Only "000" (GET/HEAD, no cookie, no auth header)
   # resolves to "don't skip" — everything else bypasses the cache.
   map $cache_bypass_method$cache_has_cookie$cache_has_auth $skip_cache {
       default 1;
       "000"   0;
   }

   server {
       listen 80;
       listen [::]:80;
       server_name _;

       root /app/backend/public;

       add_header X-XSS-Protection "1; mode=block";

       index index.html index.htm index.php;
       charset utf-8;

       access_log /dev/stdout;
       error_log /dev/stderr;

        location /storage {
            alias /app/backend/storage/app/public;
            access_log off;
            expires max;
            add_header Cache-Control "public";
        }

        # Cache-eligible public read-only endpoints only. This must be a regex
        # location, and the general /api/ prefix location below must NOT use "^~"
        # for it to ever be reached — "^~" makes nginx pick that prefix outright
        # on length and skip regex evaluation entirely, regardless of file order.
        # Kept separate from the general /api/ location so
        # fastcgi_hide_header only strips Set-Cookie here: caching a response that
        # sets a visitor-specific Laravel session cookie would otherwise replay
        # that same cookie to every other visitor served from cache.
        location ~ ^/api/public/events/\d+(/products|/questions)?$ {
            rewrite ^/api(/.*)$ /index.php$1 break;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param REQUEST_URI $1;
            fastcgi_pass localhost:9000;
            client_max_body_size 20M;

            fastcgi_cache api_cache;
            fastcgi_cache_key "$request_method$request_uri";
            fastcgi_cache_valid 200 10s;
            # Laravel sends "Cache-Control: no-cache, private" on API responses by
            # default, which would otherwise stop nginx from caching them at all.
            # We deliberately override that here, only for this handful of public,
            # non-personalized endpoints.
            fastcgi_ignore_headers Cache-Control Expires Set-Cookie;
            fastcgi_hide_header Set-Cookie;
            fastcgi_cache_use_stale error timeout updating http_500 http_503;
            fastcgi_cache_lock on;
            fastcgi_cache_bypass $skip_cache;
            fastcgi_no_cache $skip_cache;
            add_header X-Cache-Status $upstream_cache_status always;
        }

        location /api/ {
            rewrite ^/api(/.*)$ /index.php$1 break;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param REQUEST_URI $1;
            fastcgi_pass localhost:9000;
            client_max_body_size 20M;
        }

       location ~ \.php$ {
           include fastcgi_params;
           fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
           fastcgi_split_path_info ^(.+\.php)(/.+)$;
           fastcgi_pass localhost:9000;
           fastcgi_index index.php;
           fastcgi_param PHP_VALUE "error_log=/dev/stderr";
       }

       location / {
           proxy_pass http://localhost:5678;
           proxy_http_version 1.1;
           proxy_set_header Host $host;
           proxy_set_header X-Real-IP $remote_addr;
           proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
           proxy_set_header X-Forwarded-Proto $scheme;
       }

       location = /favicon.ico { access_log off; log_not_found off; }
       location = /robots.txt  { access_log off; log_not_found off; }

       error_page 404 /index.php;

       location ~ /\.(?!well-known).* {
           deny all;
       }
   }
}
